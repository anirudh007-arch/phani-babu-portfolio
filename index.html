    <script>
      // Applied before first paint so the correct theme is painted immediately
      // and the preloader never flashes the wrong background.
      (function () {
        try {
          var stored = localStorage.getItem('dpb-theme');
          var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
          var theme = stored || (prefersLight ? 'light' : 'dark');
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.classList.toggle('light', theme === 'light');
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          /* private mode — fall back to the dark default already on <html> */
        }
      })();
    </script>
